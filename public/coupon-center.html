<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>领券中心 - 阿李工坊</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    body { background: linear-gradient(180deg,#f5453a 0,#f5453a 200px,#f5f6f8 200px); }
    .phone { background: transparent; }
    .cc-head { padding: 18px 16px 6px; color: #fff; }
    .cc-head h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
    .cc-head p { font-size: 12.5px; opacity: .9; margin-top: 6px; }
    /* 节日主题横幅 */
    .cc-holiday {
      margin: 12px; border-radius: 14px; padding: 14px 16px; color: #7a2e0e;
      background: linear-gradient(135deg,#ffe9c7,#ffd9a0); box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }
    .cc-holiday b { font-size: 16px; }
    .cc-holiday p { font-size: 12.5px; margin-top: 5px; line-height: 1.6; }
    /* 券卡片 */
    .cc-card {
      position: relative; margin: 12px; border-radius: 14px; overflow: hidden;
      background: #fff; display: flex; box-shadow: 0 4px 14px rgba(0,0,0,.06);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .cc-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.12); }
    .cc-left {
      width: 112px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 18px 0; color: #fff; background: linear-gradient(135deg,#ff7a5c,#f23a2f);
    }
    .cc-card.gold .cc-left { background: linear-gradient(135deg,#f5a623,#e8890c); }
    .cc-amt { font-size: 30px; font-weight: 900; }
    .cc-amt i { font-style: normal; font-size: 15px; }
    .cc-min { font-size: 11px; opacity: .9; margin-top: 2px; }
    .cc-mid { flex: 1; padding: 13px 12px; display: flex; flex-direction: column; justify-content: center; }
    .cc-tag { display: inline-block; font-size: 11px; color: #f5453a; background: #fff0ee; border-radius: 8px; padding: 1px 8px; width: fit-content; }
    .cc-card.gold .cc-tag { color: #e8890c; background: #fff6e8; }
    .cc-title { font-size: 15.5px; font-weight: 700; margin-top: 6px; }
    .cc-exp { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
    .cc-btn {
      align-self: center; margin-right: 14px; height: 34px; padding: 0 16px; border-radius: 17px;
      background: linear-gradient(90deg,#ff7a5c,#f23a2f); color: #fff; font-size: 13px; font-weight: 700;
      transition: filter .15s ease, transform .12s ease;
    }
    .cc-card.gold .cc-btn { background: linear-gradient(90deg,#f5a623,#e8890c); }
    .cc-btn:hover { filter: brightness(1.07); }
    .cc-btn.done { background: #c8ccd4; cursor: default; }
    .cc-foot { text-align: center; font-size: 12px; color: var(--text-3); padding: 8px 0 24px; }
  </style>
</head>
<body>
<div class="phone no-tab">
  <div class="nav-bar" style="background:transparent;border-bottom:none;color:#fff">
    <a class="back" href="coupons.html" style="color:#fff">‹</a><span>领券中心</span>
  </div>

  <div class="cc-head">
    <h1>每日好券 · 节假日加场</h1>
    <p>优惠券按日期实时更新，每天来都有新惊喜</p>
  </div>

  <div id="holidayBox"></div>
  <div id="ccList"><div class="loading" style="color:#fff">加载中...</div></div>

  <div class="cc-foot">领取后可到「我的 - 优惠券」查看使用</div>
</div>

<script src="js/common.js"></script>
<script>
  (async function () {
    const user = await requireLogin();
    if (!user) return;
    const r = await api('/api/coupon-center');
    if (r.code !== 0) { toast(r.msg || '加载失败'); return; }
    const d = r.data;

    // 节日横幅（节日期间显示当前活动；平时显示最近节日预告）
    const hb = document.getElementById('holidayBox');
    if (d.holiday) {
      hb.innerHTML = `<div class="cc-holiday">
        <b>🎉 ${d.holiday.bannerTitle}</b>
        <p>${d.holiday.promo}</p>
      </div>`;
    } else if (d.upcoming) {
      hb.innerHTML = `<div class="cc-holiday">
        <b>📅 距离${d.upcoming.name}还有 ${d.upcoming.days} 天</b>
        <p>节日期间将发放${d.upcoming.name}专属大额券，记得回来领取！</p>
      </div>`;
    }

    // 券列表
    const box = document.getElementById('ccList');
    box.innerHTML = d.coupons.map((c, i) => `
      <div class="cc-card ${i % 2 ? 'gold' : ''}">
        <div class="cc-left">
          <div class="cc-amt"><i>¥</i>${c.amount}</div>
          <div class="cc-min">满${c.min}可用</div>
        </div>
        <div class="cc-mid">
          <span class="cc-tag">${c.tag}</span>
          <div class="cc-title">${c.title}</div>
          <div class="cc-exp">有效期至 ${c.expire.slice(0, 10)}</div>
        </div>
        <button class="cc-btn ${c.claimed ? 'done' : ''}" data-key="${c.key}" ${c.claimed ? 'disabled' : ''}>
          ${c.claimed ? '已领取' : '立即领取'}
        </button>
      </div>`).join('');

    // 领取
    box.querySelectorAll('.cc-btn:not(.done)').forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        const rr = await api('/api/coupons/claim', { method: 'POST', body: { key: btn.dataset.key } });
        toast(rr.msg);
        if (rr.code === 0 && rr.msg.includes('成功')) {
          btn.classList.add('done');
          btn.textContent = '已领取';
        } else if (rr.code === 0) {
          btn.classList.add('done');
          btn.textContent = '已领取';
        } else {
          btn.disabled = false;
        }
      };
    });
  })();
</script>
</body>
</html>
