<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>售后服务 - 阿李工坊</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    .tk-card { background:#fff; border-radius:14px; margin:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    .tk-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .tk-title { font-size:15.5px; font-weight:700; }
    .tk-st { font-size:12px; border-radius:10px; padding:2px 10px; }
    .tk-st.s0 { background:#fff4e5; color:#ff9500; }
    .tk-st.s1 { background:#e8f3ff; color:#2f86ff; }
    .tk-st.s2 { background:#e9f9ef; color:#07c160; }
    .tk-content { font-size:13.5px; color:var(--text-2); line-height:1.7; }
    .tk-meta { font-size:12px; color:var(--text-3); margin-top:10px; display:flex; justify-content:space-between; }
    .tk-reply { margin-top:10px; background:#f7f8fa; border-radius:10px; padding:10px 12px; font-size:13px; color:var(--text-2); }
    .tk-reply b { color:var(--blue); }
    .tk-add-btn { position:fixed; bottom:calc(var(--tab-h) + 14px); left:16px; right:16px; max-width:448px; margin:0 auto; }
    /* 提交表单弹层 */
    .tk-form-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; display:flex; align-items:flex-end; justify-content:center; }
    .tk-form { background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:480px; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); }
    .tk-form h3 { font-size:17px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
    .tk-form h3 span { color:#999; font-size:20px; cursor:pointer; font-weight:400; }
    .tk-form input, .tk-form textarea {
      width:100%; border:1px solid #e5e7eb; border-radius:10px; padding:11px 12px;
      font-size:14px; margin-bottom:12px; background:#f9fafb; box-sizing:border-box;
    }
    .tk-form textarea { height:110px; resize:none; }
  </style>
</head>
<body>
<div class="phone no-tab">
  <div class="nav-bar"><a class="back" href="profile.html">‹</a><span id="pageTitle">我的投诉</span></div>
  <div id="tkList"><div class="loading">加载中...</div></div>
  <button class="btn-red tk-add-btn" style="height:46px;font-size:16px;width:calc(100% - 32px)" id="addBtn"></button>
</div>

<!-- 提交工单弹层 -->
<div class="tk-form-mask" id="formMask" style="display:none" onclick="if(event.target===this)hideForm()">
  <div class="tk-form">
    <h3><span style="font-weight:700" id="formTitle"></span><span onclick="hideForm()">✕</span></h3>
    <input type="text" id="fOrderNo" placeholder="关联订单号（选填，如 ZMN2026...）">
    <input type="text" id="fTitle" placeholder="标题（一句话说明问题）">
    <textarea id="fContent" placeholder="请详细描述事情经过、发生时间、涉及人员等，方便平台快速核实处理"></textarea>
    <button class="btn-red" style="width:100%;height:46px;font-size:16px" id="submitBtn">提交</button>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  const type = qs('type') || 'complaint';
  const CONF = {
    complaint: { title: '我的投诉', btn: '+ 我要投诉', empty: '暂无投诉记录', icon: '📮', form: '提交投诉' },
    rework:    { title: '我的返修', btn: '+ 申请返修', empty: '暂无返修记录', icon: '🔄', form: '申请返修' },
    report:    { title: '我的举报', btn: '+ 我要举报', empty: '暂无举报记录', icon: '🚩', form: '提交举报' }
  }[type] || { title: '我的投诉', btn: '+ 我要投诉', empty: '暂无记录', icon: '📮', form: '提交投诉' };

  document.getElementById('pageTitle').textContent = CONF.title;
  document.title = CONF.title + ' - 阿李工坊';
  document.getElementById('addBtn').textContent = CONF.btn;
  document.getElementById('formTitle').textContent = CONF.form;

  /** 加载工单列表 */
  async function loadList() {
    const user = await requireLogin();
    if (!user) return;
    const r = await api('/api/tickets?type=' + type);
    const list = r.data || [];
    const box = document.getElementById('tkList');
    if (!list.length) {
      box.innerHTML = `<div class="empty"><span class="e-ico">${CONF.icon}</span>${CONF.empty}<br>
        <div style="font-size:12.5px;color:var(--text-3);margin-top:6px">如对服务有任何不满，欢迎随时反馈</div></div>`;
      return;
    }
    box.innerHTML = list.map(t => `
      <div class="tk-card">
        <div class="tk-hd">
          <span class="tk-title">${t.title}</span>
          <span class="tk-st s${t.status}">${t.status_text}</span>
        </div>
        <div class="tk-content">${t.content}</div>
        ${t.reply ? `<div class="tk-reply"><b>平台回复：</b>${t.reply}</div>` : ''}
        <div class="tk-meta">
          <span>${t.order_no ? '订单：' + t.order_no : ''}</span>
          <span>${t.created_at}</span>
        </div>
      </div>`).join('');
  }

  /** 提交工单 */
  document.getElementById('addBtn').onclick = () => document.getElementById('formMask').style.display = 'flex';
  function hideForm() { document.getElementById('formMask').style.display = 'none'; }

  document.getElementById('submitBtn').onclick = async () => {
    const order_no = document.getElementById('fOrderNo').value.trim();
    const title = document.getElementById('fTitle').value.trim();
    const content = document.getElementById('fContent').value.trim();
    if (!title) return toast('请填写标题');
    if (!content) return toast('请填写详细描述');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const r = await api('/api/tickets', { method: 'POST', body: { type, order_no, title, content } });
    btn.disabled = false;
    if (r.code === 0) {
      hideForm();
      document.getElementById('fOrderNo').value = '';
      document.getElementById('fTitle').value = '';
      document.getElementById('fContent').value = '';
      modal({ icon: '✅', title: '提交成功', text: r.msg, btn: '知道了' });
      loadList();
    } else {
      toast(r.msg);
    }
  };

  loadList();
</script>
</body>
</html>
