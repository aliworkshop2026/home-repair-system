<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>投诉反馈 - 阿李工坊</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    /* 顶部黄色提示条（参考截图） */
    .tk-tip {
      background: #fdf3d7; color: #8a6d1a; font-size: 12.5px;
      padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .tk-tip a { color: #8a6d1a; font-weight: 600; white-space: nowrap; }
    /* 双 Tab（发起 / 记录） */
    .tk-tabs { display: flex; background: #fff; }
    .tk-tab {
      flex: 1; text-align: center; padding: 13px 0 11px; font-size: 15px;
      color: var(--text-2); cursor: pointer; position: relative; transition: color .15s ease;
    }
    .tk-tab.on { color: var(--blue); font-weight: 700; }
    .tk-tab.on::after {
      content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 28px; height: 3px; border-radius: 2px; background: var(--blue);
    }
    .tk-tab:hover { color: var(--blue); }
    /* 发表单 */
    .tk-form { padding: 14px 12px; }
    .tk-form input, .tk-form textarea {
      width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px;
      font-size: 14px; margin-bottom: 12px; background: #fff; box-sizing: border-box;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .tk-form input:focus, .tk-form textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(61,139,253,.10); }
    .tk-form textarea { height: 130px; resize: none; }
    /* 空状态（参考截图插画+文案） */
    .tk-empty { text-align: center; padding: 70px 30px 40px; }
    .tk-empty img { width: 170px; margin: 0 auto 18px; border-radius: 50%; }
    .tk-empty p { font-size: 13.5px; color: var(--text-3); line-height: 1.8; }
    /* 记录卡片 */
    .tk-card { background:#fff; border-radius:14px; margin:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    .tk-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .tk-title { font-size:15.5px; font-weight:700; }
    .tk-st { font-size:12px; border-radius:10px; padding:2px 10px; }
    .tk-st.s0 { background:#fff4e5; color:#ff9500; }
    .tk-st.s1 { background:#e8f3ff; color:#2f86ff; }
    .tk-st.s2 { background:#e9f9ef; color:#07c160; }
    .tk-content { font-size:13.5px; color:var(--text-2); line-height:1.7; }
    .tk-meta { font-size:12px; color:var(--text-3); margin-top:10px; display:flex; justify-content:space-between; }
    .tk-reply { margin-top:10px; background:#f7f8fa; border-radius:10px; padding:10px 12px; font-size:13px; color:var(--text-2); }
    .tk-reply b { color:var(--blue); }
  </style>
</head>
<body>
<div class="phone no-tab">
  <div class="nav-bar"><a class="back" href="profile.html">‹</a><span id="pageTitle">投诉反馈</span></div>

  <!-- 黄色提示条 -->
  <div class="tk-tip">
    <span id="tipText">您的哪个订单出现了问题？</span>
    <a href="tel:02363153464" id="tipPhone">投诉电话:023-63153464 去拨打 &gt;</a>
  </div>

  <!-- 双 Tab -->
  <div class="tk-tabs">
    <div class="tk-tab on" id="tabNew">发起投诉</div>
    <div class="tk-tab" id="tabList">投诉记录</div>
  </div>

  <!-- 发起工单 -->
  <div class="tk-form" id="paneNew">
    <input type="text" id="fOrderNo" placeholder="关联订单号（选填，如 ZMN2026...）">
    <input type="text" id="fTitle" placeholder="标题（一句话说明问题）">
    <textarea id="fContent" placeholder="请详细描述事情经过、发生时间、涉及人员等，方便平台快速核实处理"></textarea>
    <button class="btn-red" style="width:100%;height:46px;font-size:16px" id="submitBtn">提交</button>
  </div>

  <!-- 工单记录 -->
  <div id="paneList" style="display:none">
    <div id="tkList"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  const type = qs('type') || 'complaint';
  const CONF = {
    complaint: { title: '投诉反馈', tabNew: '发起投诉', tabList: '投诉记录', tip: '您的哪个订单出现了问题？', phone: '投诉电话:023-63153464 去拨打 >', btn: '提交投诉' },
    rework:    { title: '返修申请', tabNew: '发起返修', tabList: '返修记录', tip: '哪一单需要再次上门返修？', phone: '客服电话:023-63153464 去拨打 >', btn: '申请返修' },
    report:    { title: '举报中心', tabNew: '发起举报', tabList: '举报记录', tip: '您要举报哪个订单或人员？', phone: '客服电话:023-63153464 去拨打 >', btn: '提交举报' }
  }[type] || {};

  document.getElementById('pageTitle').textContent = CONF.title;
  document.title = CONF.title + ' - 阿李工坊';
  document.getElementById('tabNew').textContent = CONF.tabNew;
  document.getElementById('tabList').textContent = CONF.tabList;
  document.getElementById('tipText').textContent = CONF.tip;
  document.getElementById('tipPhone').textContent = CONF.phone;
  document.getElementById('submitBtn').textContent = CONF.btn;

  const EMPTY_IMG = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' +
    encodeURIComponent('cute flat vector illustration of a small blue repair worker mascot character standing beside a tall blank clipboard document, soft light blue circular background, clean minimal empty-state illustration for mobile app, pastel colors, no text') +
    '&image_size=square';

  /** Tab 切换 */
  const tabNew = document.getElementById('tabNew');
  const tabList = document.getElementById('tabList');
  const paneNew = document.getElementById('paneNew');
  const paneList = document.getElementById('paneList');
  function switchTab(which) {
    tabNew.classList.toggle('on', which === 'new');
    tabList.classList.toggle('on', which === 'list');
    paneNew.style.display = which === 'new' ? '' : 'none';
    paneList.style.display = which === 'list' ? '' : 'none';
    if (which === 'list') loadList();
  }
  tabNew.onclick = () => switchTab('new');
  tabList.onclick = () => switchTab('list');

  /** 加载工单记录 */
  let listLoaded = false;
  async function loadList() {
    const user = await requireLogin();
    if (!user) return;
    const box = document.getElementById('tkList');
    if (!listLoaded) box.innerHTML = '<div class="loading">加载中...</div>';
    const r = await api('/api/tickets?type=' + type);
    const list = r.data || [];
    listLoaded = true;
    if (!list.length) {
      box.innerHTML = `<div class="tk-empty">
        <img src="${EMPTY_IMG}" alt="暂无记录">
        <p>太难了～还没有发起反馈数据，主人看看其他服务吧</p>
      </div>`;
      return;
    }
    box.innerHTML = list.map(t => `
      <div class="tk-card">
        <div class="tk-hd">
          <span class="tk-title">${t.title}</span>
          <span class="tk-st s${t.status}">${t.status_text}</span>
        </div>
        <div class="tk-content">${t.content}</div>
        ${t.reply ? `<div class="tk-reply"><b>平台回复：</b>${t.reply}</div>` : ''}
        <div class="tk-meta">
          <span>${t.order_no ? '订单：' + t.order_no : ''}</span>
          <span>${t.created_at}</span>
        </div>
      </div>`).join('');
  }

  /** 提交工单 */
  document.getElementById('submitBtn').onclick = async () => {
    const user = await requireLogin();
    if (!user) return;
    const order_no = document.getElementById('fOrderNo').value.trim();
    const title = document.getElementById('fTitle').value.trim();
    const content = document.getElementById('fContent').value.trim();
    if (!title) return toast('请填写标题');
    if (!content) return toast('请填写详细描述');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const r = await api('/api/tickets', { method: 'POST', body: { type, order_no, title, content } });
    btn.disabled = false;
    if (r.code === 0) {
      document.getElementById('fOrderNo').value = '';
      document.getElementById('fTitle').value = '';
      document.getElementById('fContent').value = '';
      modal({ icon: '✅', title: '提交成功', text: r.msg, btn: '知道了' });
      listLoaded = false;
      switchTab('list');
    } else {
      toast(r.msg);
    }
  };
</script>
</body>
</html>
