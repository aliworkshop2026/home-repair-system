<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>添加地址 - 阿李工坊</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="phone">

  <div class="nav-bar">
    <a class="back" href="address.html">‹</a>
    <span id="pageTitle">添加地址</span>
  </div>

  <div class="card" style="margin:12px">
    <!-- 所在城市 -->
    <div class="form-row" style="margin-bottom:16px">
      <label style="display:block;font-size:14px;color:var(--text-2);margin-bottom:8px">所在城市</label>
      <input type="text" id="city" placeholder="请选择城市" readonly onclick="showCityPicker()" style="width:100%;height:44px;border:1px solid #e3e5e8;border-radius:8px;padding:0 12px;font-size:14px;background:#fff;cursor:pointer">
    </div>

    <!-- 具体地址（带定位） -->
    <div class="form-row" style="margin-bottom:16px">
      <label style="display:block;font-size:14px;color:var(--text-2);margin-bottom:8px">具体地址</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="address" placeholder="请输入小区/街道/写字楼名称" style="flex:1;height:44px;border:1px solid #e3e5e8;border-radius:8px;padding:0 12px;font-size:14px">
        <button onclick="getLocation()" style="width:44px;height:44px;border:1px solid var(--blue);background:var(--blue-light);color:var(--blue);border-radius:8px;font-size:18px;cursor:pointer" title="定位">📍</button>
      </div>
    </div>

    <!-- 楼号/门牌号 -->
    <div class="form-row" style="margin-bottom:16px">
      <label style="display:block;font-size:14px;color:var(--text-2);margin-bottom:8px">楼号/门牌号</label>
      <input type="text" id="detail" placeholder="如：1号楼2单元301" style="width:100%;height:44px;border:1px solid #e3e5e8;border-radius:8px;padding:0 12px;font-size:14px">
    </div>

    <!-- 联系人 -->
    <div class="form-row" style="margin-bottom:16px">
      <label style="display:block;font-size:14px;color:var(--text-2);margin-bottom:8px">联系人</label>
      <input type="text" id="contact" placeholder="请输入联系人姓名" style="width:100%;height:44px;border:1px solid #e3e5e8;border-radius:8px;padding:0 12px;font-size:14px">
    </div>

    <!-- 手机号码 -->
    <div class="form-row" style="margin-bottom:16px">
      <label style="display:block;font-size:14px;color:var(--text-2);margin-bottom:8px">手机号码</label>
      <input type="tel" id="phone" placeholder="请输入手机号码" maxlength="11" style="width:100%;height:44px;border:1px solid #e3e5e8;border-radius:8px;padding:0 12px;font-size:14px">
    </div>
  </div>

  <!-- 保存按钮 -->
  <div style="padding:0 16px 30px">
    <button class="btn-primary" onclick="saveAddress()" id="saveBtn">保存</button>
  </div>

</div>

<!-- 城市选择浮层 -->
<div class="city-modal" id="cityModal" style="display:none">
  <div class="city-panel">
    <div class="city-panel-hd">
      <b>选择城市</b>
      <span class="city-close" onclick="hideCityPicker()">✕</span>
    </div>
    <div class="city-tabs" id="cityTabs"></div>
    <div class="city-list" id="cityList"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  renderTabbar('me');

  const editId = Number(qs('id')) || 0;
  if (editId) document.getElementById('pageTitle').textContent = '编辑地址';

  /* ---------------- 城市选择 ---------------- */
  const CITY_ZONES = {
    '华北': ['北京市','天津市','石家庄市','太原市','呼和浩特市','保定市','邯郸市','唐山市','廊坊市','承德市','张家口市','沧州市','衡水市','邢台市'],
    '华东': ['上海市','南京市','杭州市','合肥市','福州市','南昌市','济南市','苏州市','无锡市','宁波市','温州市','青岛市','厦门市','泉州市','烟台市','威海市','临沂市','潍坊市'],
    '华南': ['广州市','深圳市','南宁市','海口市','三亚市','东莞市','佛山市','珠海市','中山市','惠州','汕头市','湛江市','桂林市','柳州市'],
    '华中': ['武汉市','长沙市','郑州市','洛阳市','宜昌市','襄阳市','株洲市','湘潭市','衡阳市','岳阳市','信阳市','南阳市','开封市'],
    '东北': ['沈阳市','大连市','长春市','哈尔滨市','鞍山市','抚顺市','吉林市','大庆市','齐齐哈尔市','锦州市','营口市','丹东市'],
    '西南': ['重庆市','成都市','贵阳市','昆明市','拉萨市','绵阳市','德阳市','南充市','遵义市','曲靖市','大理市','泸州市','宜宾市'],
    '西北': ['西安市','兰州市','西宁市','银川市','乌鲁木齐市','宝鸡市','咸阳市','渭南市','汉中市','天水市','酒泉市','克拉玛依市']
  };
  let selectedCity = '北京市';
  let selectedZone = '华北';

  function showCityPicker() {
    document.getElementById('cityModal').style.display = '';
    renderCityTabs();
    renderCityList();
  }
  function hideCityPicker() {
    document.getElementById('cityModal').style.display = 'none';
  }
  function renderCityTabs() {
    document.getElementById('cityTabs').innerHTML = Object.keys(CITY_ZONES).map(z =>
      `<button class="city-tab ${z === selectedZone ? 'on' : ''}" data-zone="${z}">${z}</button>`
    ).join('');
  }
  function renderCityList() {
    const cities = CITY_ZONES[selectedZone] || [];
    document.getElementById('cityList').innerHTML = cities.map(c =>
      `<span class="city-item ${c === selectedCity ? 'on' : ''}" data-c="${c}">${c}</span>`
    ).join('');
  }
  document.getElementById('cityTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.city-tab');
    if (!tab) return;
    selectedZone = tab.dataset.zone;
    renderCityTabs();
    renderCityList();
  });
  document.getElementById('cityList').addEventListener('click', (e) => {
    const item = e.target.closest('.city-item');
    if (!item) return;
    selectedCity = item.dataset.c;
    document.getElementById('city').value = selectedCity;
    hideCityPicker();
  });

  /* ---------------- 定位功能 ---------------- */
  function getLocation() {
    if (!navigator.geolocation) { toast('您的浏览器不支持定位'); return; }
    toast('正在获取位置...');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // 模拟根据坐标获取地址（实际项目需调用地图API）
        document.getElementById('address').value = '当前位置附近（模拟定位成功）';
        toast('定位成功');
      },
      (err) => {
        toast('定位失败，请手动输入');
      },
      { timeout: 5000 }
    );
  }

  /* ---------------- 加载/保存地址 ---------------- */
  (async function init() {
    const user = await currentUser();
    if (!user) { go('login.html?redirect=address-add.html'); return; }

    if (editId) {
      // 编辑模式：加载已有地址
      const r = await api('/api/addresses/' + editId);
      if (r.data) {
        document.getElementById('city').value = r.data.city || '';
        document.getElementById('address').value = r.data.address || '';
        document.getElementById('detail').value = r.data.detail || '';
        document.getElementById('contact').value = r.data.contact || '';
        document.getElementById('phone').value = r.data.phone || '';
      }
    }
  })();

  async function saveAddress() {
    const city = document.getElementById('city').value.trim();
    const address = document.getElementById('address').value.trim();
    const detail = document.getElementById('detail').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!city) { toast('请选择所在城市'); return; }
    if (!address) { toast('请输入具体地址'); return; }
    if (!contact) { toast('请输入联系人姓名'); return; }
    if (!phone || phone.length !== 11) { toast('请输入正确的手机号码'); return; }

    const data = { city, address, detail, contact, phone };
    const url = editId ? '/api/addresses/' + editId : '/api/addresses';
    const method = editId ? 'PUT' : 'POST';

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '保存中...';

    const r = await api(url, { method, body: JSON.stringify(data) });
    if (r.code === 0) {
      toast(editId ? '修改成功' : '添加成功');
      setTimeout(() => go('address.html'), 800);
    } else {
      toast(r.msg || '保存失败');
      btn.disabled = false;
      btn.textContent = '保存';
    }
  }
</script>
</body>
</html>
