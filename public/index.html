<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>阿李工坊 - 首页</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="phone">

  <!-- ===== 顶部紫色品牌头图 ===== -->
  <div class="home-hero">
    <div class="brand-row">
      <div class="brand-logo-row">
        <div class="brand-logo">🐴</div>
        <div class="brand">阿李工坊</div>
        <h1><span class="big">正规</span><span class="sml">家庭维修</span><br><span class="big">就找阿李工坊</span></h1>
      </div>
      <div class="sticker">除了感情不修，<br>啥都修！</div>
    </div>
    <!-- 搜索条（悬浮于头图底部） -->
    <div class="search-bar" id="searchBar">
      <span class="city" id="cityName">北京市 ▾</span>
      <span class="divider"></span>
      <span class="ico">🔍</span>
      <span class="ipt" id="searchIpt">挂机空调维修</span>
    </div>
    <!-- 地区选择浮层 -->
    <div class="city-modal" id="cityModal" style="display:none">
      <div class="city-panel">
        <div class="city-panel-hd">
          <b>选择地区</b>
          <span class="city-close" id="cityClose">✕</span>
        </div>
        <div class="city-tabs" id="cityTabs"></div>
        <div class="city-list" id="cityList"></div>
      </div>
    </div>
  </div>

  <!-- ===== 分类宫格（两页切换） ===== -->
  <div class="card category-card">
    <div class="cat-grid" id="catGrid"></div>
    <div class="cat-dots" id="catDots"><i class="on"></i><i></i></div>
  </div>

  <!-- ===== 轮播广告图 ===== -->
  <div class="swiper" id="swiper">
    <div class="slides" id="bannerSlides"></div>
    <div class="dots" id="bannerDots"></div>
  </div>

  <!-- ===== 公告区域 ===== -->
  <div class="notice-bar">
    <span class="lbl">📢 公告</span>
    <div class="marquee"><span id="noticeText"></span></div>
  </div>

  <!-- ===== 客服联系卡 ===== -->
  <a class="service-card" href="consult.html">
    <div class="face">👩‍💼</div>
    <div class="txt">
      <b>未找到您想要的服务？</b>
      <p>贴心服务，人工客服1对1答疑</p>
    </div>
    <div class="call-btn">📞 立即联系<br>专属管家</div>
  </a>

  <!-- ===== 维修服务推荐 ===== -->
  <div class="section-title">
    <span class="t-wrap">维修服务推荐</span>
    <a class="more" href="services.html">更多 ›</a>
  </div>
  <div class="rec-grid" id="recGrid"></div>

  <!-- ===== 热门团购 ===== -->
  <div class="section-title">
    <span class="t-wrap"><i class="hot-fire">🔥</i><span style="color:var(--red)">热门</span><span style="color:#22252b">团购</span> <span style="font-size:12px;background:var(--red);color:#fff;border-radius:6px;padding:2px 8px;margin-left:6px;font-weight:400">省钱又省心</span></span>
  </div>
  <div class="goods-grid" id="groupGrid"></div>

  <!-- ===== 更多热销服务推荐 ===== -->
  <div class="section-title"><span class="t-wrap">更多热销服务推荐</span></div>
  <div class="goods-grid" id="hotGrid"></div>

  <!-- ===== 招募横幅 ===== -->
  <div class="recruit">
    <h3>招募维修工程师/学徒</h3>
    <div class="sub">全国招募 · 免费技术指导</div>
    <div class="perks">✔ 就近推单　✔ 自由领单　✔ 多做多得　✔ 上不封顶</div>
  </div>

  <div class="brand-foot">
    <b style="font-size:16px">阿李工坊</b><br>
    <div class="marquee-line"><div class="mq-track" id="homeMq"></div></div>
  </div>

</div>

<!-- ===== 开屏广告（每次会话首次打开显示，4秒自动进入首页） ===== -->
<div class="splash" id="splash">
  <div class="splash-title">
    <span class="big">正规</span><span class="sml">家庭维修</span><br>
    <span class="big">就找阿李工坊</span>
  </div>
  <div class="splash-bubble">除了感情不修<br><b>啥都修</b></div>
  <div class="splash-mascot">🐴<span class="wrench">🔧</span></div>
  <div class="splash-brand"><span class="mini-logo">🐴</span>阿李工坊 <em>家庭维修</em></div>
  <button class="splash-skip" id="splashSkip">跳过 <span id="splashSec">4</span></button>
</div>

<!-- ===== 红包优惠券弹窗（开屏广告结束后立即弹出，会话内仅一次） ===== -->
<div class="redpack-mask" id="redpackMask" style="display:none">
  <div class="redpack">
    <!-- 小马 logo（动态）+ 马嘴边的小对话框 -->
    <div class="rp-rider">
      <div class="rp-dialog">马上就来</div>
      <div class="rp-horse">🐎</div>
    </div>
    <div class="rp-brand">🐴 阿李工坊 · 限时福利</div>
    <div class="rp-type">全平台通用</div>
    <div class="rp-amt"><i>¥</i>18</div>
    <div class="rp-cond" onclick="location.href='services.html?tag='+encodeURIComponent('满150可用专区')+'&min=150'">满150可用</div>
    <div class="rp-tag" onclick="location.href='services.html?tag='+encodeURIComponent('消费凑单专区')+'&max=50'">消费凑单</div>
  </div>
  <button class="rp-close" id="rpClose" aria-label="关闭">✕</button>
</div>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
