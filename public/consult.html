<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>在线咨询 - 阿李工坊</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    .chat-header {
      height:48px; background:#fff; display:flex; align-items:center; justify-content:center;
      font-size:17px; font-weight:600; position:sticky; top:0; z-index:50;
      border-bottom: 1px solid #eef0f3;
    }
    .chat-phone { max-width:480px; margin:0 auto; height:100vh; display:flex; flex-direction:column;
      background:#eef0f3; box-shadow:0 0 24px rgba(0,0,0,.08); }
    .chat-history-tip { text-align:center; padding:10px; }
    .chat-history-tip span {
      background:#fff; color:#8a8f99; font-size:13px; border-radius:16px; padding:6px 16px;
    }

    /* 输入栏 + 加号按钮（空内容点击展开快捷面板 / 有内容变发送） */
    .chat-foot {
      background:#f7f8fa; padding:8px 12px calc(8px + env(safe-area-inset-bottom));
      display:flex; gap:8px; align-items:center;
    }
    .chat-foot input {
      flex:1; height:40px; border-radius:20px; border:none; padding:0 16px;
      font-size:14.5px; background:#fff;
    }
    .chat-foot .plus {
      width:40px; height:40px; border-radius:50%; border:1.5px solid var(--blue);
      color:var(--blue); font-size:22px; background:#fff; line-height:1;
      display:flex; align-items:center; justify-content:center;
      transition: all .15s;
    }
    .chat-foot .plus.is-send {
      background: var(--blue); color:#fff; font-size:14px; font-weight:600;
      width:auto; padding:0 16px; border-radius:20px;
    }

    /* 快捷功能面板（点加号弹出） */
    .chat-actions {
      background:#f7f8fa; padding:18px 12px calc(18px + env(safe-area-inset-bottom));
      display:flex; gap:24px; border-top:1px solid #eef0f3;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity:0 } to { transform: translateY(0); opacity:1 } }
    .action-btn {
      display:flex; flex-direction:column; align-items:center; gap:6px;
      background:transparent; border:none; cursor:pointer;
    }
    .action-ico {
      width:54px; height:54px; border-radius:14px; background:#fff;
      display:flex; align-items:center; justify-content:center; font-size:26px;
      box-shadow:0 2px 8px rgba(0,0,0,.06); border:1px solid #eef0f3;
    }
    .action-btn span:last-child { font-size:12px; color:#333; }

    /* 评价弹窗 */
    .rate-mask {
      position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200;
      display:flex; align-items:center; justify-content:center;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .rate-box {
      width:80%; max-width:320px; background:#fff; border-radius:16px; padding:20px;
      animation: popIn .2s ease;
    }
    @keyframes popIn { from { transform: scale(.85); opacity:0 } to { transform: scale(1); opacity:1 } }
    .rate-title { font-size:16px; font-weight:600; text-align:center; margin-bottom:6px; }
    .rate-sub { font-size:13px; color:#8a8f99; text-align:center; margin-bottom:16px; }
    .rate-stars { display:flex; gap:10px; justify-content:center; margin-bottom:18px; }
    .rate-stars span { font-size:32px; cursor:pointer; filter: grayscale(1); opacity:.5; transition: all .12s; }
    .rate-stars span.active { filter: none; opacity:1; transform: scale(1.1); }
    .rate-actions { display:flex; gap:10px; }
    .rate-actions button {
      flex:1; height:38px; border-radius:19px; font-size:14px; cursor:pointer; border:none;
    }
    .rate-actions .cancel { background:#f3f4f6; color:#666; }
    .rate-actions .submit { background:var(--blue); color:#fff; font-weight:600; }

    /* 图片预览 */
    .img-preview-mask {
      position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .img-preview-mask img { max-width:100%; max-height:80vh; border-radius:8px; }
    .img-preview-close {
      position:absolute; top:20px; right:20px; color:#fff; font-size:28px;
      background:rgba(0,0,0,.4); width:36px; height:36px; border-radius:50%;
      border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
  </style>
</head>
<body>
<div class="chat-phone">
  <div class="chat-header">在线咨询</div>

  <div class="chat-body" id="chatBody">
    <div class="chat-history-tip"><span>点击查看所有聊天记录 ∨</span></div>
  </div>

  <!-- 快捷功能面板（点加号展开） -->
  <div class="chat-actions" id="chatActions" style="display:none">
    <button class="action-btn" id="actImg">
      <span class="action-ico">🖼️</span>
      <span>图片</span>
    </button>
    <button class="action-btn" id="actHuman">
      <span class="action-ico">🎧</span>
      <span>转人工</span>
    </button>
    <button class="action-btn" id="actRate">
      <span class="action-ico">💬</span>
      <span>评价</span>
    </button>
  </div>

  <div class="chat-foot">
    <input type="text" id="chatInput" placeholder="请输入您的问题">
    <button class="plus" id="plusBtn">＋</button>
  </div>

  <!-- 底部 Tab（咨询高亮） -->
  <div class="tabbar" style="position:static;transform:none;max-width:none">
    <a href="index.html"><span class="tab-ico">🏠</span>首页</a>
    <a href="services.html"><span class="tab-ico">🧩</span>服务</a>
    <a href="consult.html" class="active"><span class="tab-ico">🎧</span>在线咨询</a>
    <a href="profile.html"><span class="tab-ico">👤</span>我的</a>
  </div>
</div>

<!-- 隐藏的文件选择器（图片功能用） -->
<input type="file" id="imgPicker" accept="image/*" style="display:none">

<script src="js/common.js"></script>
<script src="js/consult.js"></script>
</body>
</html>
