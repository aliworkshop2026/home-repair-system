<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咨询留言管理 - 阿李工坊后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="root">
  <div class="panel">
    <div class="panel-hd"><b>在线咨询 / 留言管理</b></div>
    <div class="panel-bd" style="padding:0">
      <table>
        <thead><tr>
          <th>用户ID</th><th>账号</th><th>昵称</th><th>留言条数</th>
          <th>最新消息</th><th>最近时间</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
async function load() {
  const r = await api('/api/admin/messages');
  const list = r.data || [];
  document.getElementById('tbody').innerHTML = list.length ? list.map(u => `
    <tr>
      <td>${u.user_id}</td>
      <td>${esc(u.username || '-')}</td>
      <td>${esc(u.nickname || '-')}</td>
      <td>${u.msg_count} 条</td>
      <td style="max-width:340px">${esc(u.last_content || '-')}</td>
      <td style="white-space:nowrap">${u.last_time || '-'}</td>
      <td><button class="btn btn-plain btn-sm" onclick='openChat(${u.user_id}, "${esc(u.nickname || u.username)}")'>查看/回复</button></td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty-row">暂无咨询留言</td></tr>';
}

/** 打开聊天记录并回复 */
window.openChat = async function (userId, name) {
  const r = await api('/api/admin/messages/' + userId);
  const list = r.data || [];
  const m = openModal(`
    <div class="m-hd">与「${name}」的聊天记录<button class="x" onclick="closeModal()">×</button></div>
    <div class="m-bd">
      <div class="chat-win" id="chatWin">
        ${list.map(x => `
          <div class="chat-line ${x.role === 'admin' ? 'me' : ''}">
            <div>
              <div class="bub">${esc(x.content)}</div>
              <div class="tm" style="${x.role === 'admin' ? 'text-align:right' : ''}">${x.created_at}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="f-item" style="margin-top:14px"><label>客服回复</label>
        <textarea id="replyText" placeholder="输入回复内容..."></textarea>
      </div>
    </div>
    <div class="m-ft">
      <button class="btn btn-gray" onclick="closeModal()">关闭</button>
      <button class="btn btn-blue" id="replyBtn">发送回复</button>
    </div>`);
  m.querySelector('#chatWin').scrollTop = 99999;
  m.querySelector('#replyBtn').onclick = async () => {
    const content = m.querySelector('#replyText').value.trim();
    if (!content) return toast('请输入回复内容');
    const rr = await api(`/api/admin/messages/${userId}/reply`, { method: 'POST', body: { content } });
    toast(rr.msg);
    if (rr.code === 0) { closeModal(); load(); }
  };
};

(async function init() { await renderLayout('咨询留言', 'messages.html'); load(); })();
</script>
</body>
</html>
