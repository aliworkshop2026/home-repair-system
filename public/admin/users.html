<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户信息管理 - 阿李工坊后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="root">
  <div class="panel">
    <div class="panel-hd"><b>用户信息管理</b></div>
    <div class="panel-bd">
      <div class="toolbar">
        <input type="text" id="kw" placeholder="搜索账号 / 昵称 / 手机号" style="width:260px">
        <button class="btn btn-blue" id="searchBtn">🔍 搜索</button>
        <div class="sp"></div>
        <button class="btn btn-blue" id="addBtn">＋ 新增用户</button>
      </div>
      <table>
        <thead><tr>
          <th>ID</th><th>头像</th><th>账号</th><th>昵称</th><th>手机号</th>
          <th>订单数</th><th>状态</th><th>注册时间</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
let users = [];

async function load() {
  const kw = document.getElementById('kw').value.trim();
  const r = await api('/api/admin/users' + (kw ? '?keyword=' + encodeURIComponent(kw) : ''));
  users = r.data || [];
  document.getElementById('tbody').innerHTML = users.length ? users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td style="font-size:22px">${u.avatar || '😀'}</td>
      <td>${esc(u.username)}</td>
      <td>${esc(u.nickname || '-')}</td>
      <td>${esc(u.phone || '-')}</td>
      <td>${u.order_count}</td>
      <td><span class="tag ${u.status === 1 ? 'tag-green' : 'tag-gray'}">${u.status === 1 ? '正常' : '已禁用'}</span></td>
      <td>${u.created_at}</td>
      <td>
        <button class="btn btn-plain btn-sm" onclick='editUser(${u.id})'>编辑</button>
        <button class="btn btn-red btn-sm" onclick='delUser(${u.id})'>删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="9" class="empty-row">暂无用户</td></tr>';
}

/** 新增弹窗 */
document.getElementById('addBtn').onclick = () => {
  const m = openModal(`
    <div class="m-hd">新增用户<button class="x" onclick="closeModal()">×</button></div>
    <div class="m-bd">
      <div class="f-item"><label>登录账号 *</label><input id="f_username"></div>
      <div class="f-item"><label>登录密码 *</label><input id="f_password" type="text" placeholder="至少6位"></div>
      <div class="f-item"><label>昵称</label><input id="f_nickname"></div>
      <div class="f-item"><label>手机号</label><input id="f_phone"></div>
    </div>
    <div class="m-ft">
      <button class="btn btn-gray" onclick="closeModal()">取消</button>
      <button class="btn btn-blue" id="saveAdd">保存</button>
    </div>`);
  m.querySelector('#saveAdd').onclick = async () => {
    const body = {
      username: m.querySelector('#f_username').value.trim(),
      password: m.querySelector('#f_password').value.trim(),
      nickname: m.querySelector('#f_nickname').value.trim(),
      phone: m.querySelector('#f_phone').value.trim()
    };
    if (!body.username || !body.password) return toast('账号密码不能为空');
    const r = await api('/api/admin/users', { method: 'POST', body });
    toast(r.msg);
    if (r.code === 0) { closeModal(); load(); }
  };
};

/** 编辑弹窗 */
window.editUser = function (id) {
  const u = users.find(x => x.id === id);
  const m = openModal(`
    <div class="m-hd">编辑用户<button class="x" onclick="closeModal()">×</button></div>
    <div class="m-bd">
      <div class="f-item"><label>昵称</label><input id="f_nickname" value="${esc(u.nickname || '')}"></div>
      <div class="f-item"><label>手机号</label><input id="f_phone" value="${esc(u.phone || '')}"></div>
      <div class="f-item"><label>账号状态</label>
        <select id="f_status">
          <option value="1" ${u.status === 1 ? 'selected' : ''}>正常</option>
          <option value="0" ${u.status === 0 ? 'selected' : ''}>禁用</option>
        </select>
      </div>
      <div class="f-item"><label>重置密码（留空则不修改）</label><input id="f_password" type="text"></div>
    </div>
    <div class="m-ft">
      <button class="btn btn-gray" onclick="closeModal()">取消</button>
      <button class="btn btn-blue" id="saveEdit">保存</button>
    </div>`);
  m.querySelector('#saveEdit').onclick = async () => {
    const body = {
      nickname: m.querySelector('#f_nickname').value.trim(),
      phone: m.querySelector('#f_phone').value.trim(),
      status: Number(m.querySelector('#f_status').value),
      password: m.querySelector('#f_password').value.trim()
    };
    const r = await api('/api/admin/users/' + id, { method: 'PUT', body });
    toast(r.msg);
    if (r.code === 0) { closeModal(); load(); }
  };
};

/** 删除 */
window.delUser = async function (id) {
  if (!confirm('删除后该用户的历史订单仍保留，确定删除？')) return;
  const r = await api('/api/admin/users/' + id, { method: 'DELETE' });
  toast(r.msg);
  if (r.code === 0) load();
};

document.getElementById('searchBtn').onclick = load;
document.getElementById('kw').onkeydown = e => { if (e.key === 'Enter') load(); };

(async function init() { await renderLayout('用户信息管理', 'users.html'); load(); })();
</script>
</body>
</html>
