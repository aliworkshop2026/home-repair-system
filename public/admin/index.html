<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据概览 - 阿李工坊后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="root">
  <!-- 统计卡片 -->
  <div class="stat-grid" id="statGrid"></div>

  <!-- 最新订单 -->
  <div class="panel">
    <div class="panel-hd">
      <b>最新报修订单</b>
      <a href="orders.html" class="btn btn-plain btn-sm" style="margin-left:auto">查看全部</a>
    </div>
    <div class="panel-bd" style="padding:0">
      <table>
        <thead><tr>
          <th>订单号</th><th>用户</th><th>服务项目</th><th>设备</th><th>地址</th>
          <th>师傅</th><th>金额</th><th>状态</th><th>下单时间</th>
        </tr></thead>
        <tbody id="latestOrders"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
const STATUS_TAG = { 0:'tag-orange', 1:'tag-red', 2:'tag-blue', 3:'tag-green', 4:'tag-gray' };
const STATUS_TXT = { 0:'待预约', 1:'待支付', 2:'待检修', 3:'已完成', 4:'已取消' };

async function init() {
  await renderLayout('数据概览', 'index.html');

  // 统计数据
  const sr = await api('/api/admin/stats');
  const s = sr.data || {};
  const cards = [
    { ico:'👥', lbl:'注册用户', val:s.user_count, cls:'bg-blue' },
    { ico:'👷', lbl:'在岗师傅', val:s.worker_count, cls:'bg-green' },
    { ico:'📋', lbl:'订单总数', val:s.order_count, cls:'bg-orange' },
    { ico:'⏳', lbl:'待预约订单', val:s.pending_count, cls:'bg-red' },
    { ico:'🔧', lbl:'待检修订单', val:s.repair_count = (s.order_count - s.done_count - s.pending_count), cls:'bg-purple' },
    { ico:'✅', lbl:'已完成订单', val:s.done_count, cls:'bg-green' },
    { ico:'💰', lbl:'已支付流水(元)', val:s.revenue, cls:'bg-blue' },
    { ico:'⭐', lbl:'用户评价', val:s.review_count, cls:'bg-orange' }
  ];
  document.getElementById('statGrid').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="s-ico ${c.cls}">${c.ico}</div>
      <div><div class="s-num">${c.val ?? 0}</div><div class="s-lbl">${c.lbl}</div></div>
    </div>`).join('');

  // 最新 8 条订单
  const or = await api('/api/admin/orders');
  const list = (or.data || []).slice(0, 8);
  document.getElementById('latestOrders').innerHTML = list.length ? list.map(o => `
    <tr>
      <td>${o.order_no}</td>
      <td>${esc(o.nickname || '-')}</td>
      <td>${esc(o.service_name || '-')}</td>
      <td>${esc(o.device_name || '-')}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.address || '-')}</td>
      <td>${esc(o.worker_name || '-')}</td>
      <td class="${o.price > 0 ? '' : ''}" style="color:var(--red);font-weight:700">${o.price > 0 ? '¥' + o.price : '待报价'}</td>
      <td><span class="tag ${STATUS_TAG[o.status]}">${STATUS_TXT[o.status]}</span></td>
      <td>${o.created_at}</td>
    </tr>`).join('') : '<tr><td colspan="9" class="empty-row">暂无订单</td></tr>';
}
init();
</script>
</body>
</html>
