<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>维修师傅管理 - 阿李工坊后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="root">
  <div class="panel">
    <div class="panel-hd"><b>维修师傅管理</b></div>
    <div class="panel-bd">
      <div class="toolbar">
        <input type="text" id="kw" placeholder="搜索姓名 / 技能 / 电话" style="width:260px">
        <button class="btn btn-blue" id="searchBtn">🔍 搜索</button>
        <div class="sp"></div>
        <button class="btn btn-blue" id="addBtn">＋ 新增师傅</button>
      </div>
      <table>
        <thead><tr>
          <th>ID</th><th>头像</th><th>姓名</th><th>电话</th><th>擅长技能</th>
          <th>从业年限</th><th>评分</th><th>累计接单</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
let workers = [];

async function load() {
  const kw = document.getElementById('kw').value.trim();
  const r = await api('/api/admin/workers' + (kw ? '?keyword=' + encodeURIComponent(kw) : ''));
  workers = r.data || [];
  document.getElementById('tbody').innerHTML = workers.length ? workers.map(w => `
    <tr>
      <td>${w.id}</td>
      <td style="font-size:22px">${w.avatar}</td>
      <td><b>${esc(w.name)}</b></td>
      <td>${esc(w.phone || '-')}</td>
      <td>${esc(w.skill || '-')}</td>
      <td>${w.years} 年</td>
      <td>⭐ ${w.rating}</td>
      <td>${w.order_count} 单</td>
      <td><span class="tag ${w.status === 1 ? 'tag-green' : 'tag-gray'}">${w.status === 1 ? '在岗' : '停用'}</span></td>
      <td>
        <button class="btn btn-plain btn-sm" onclick='editWorker(${w.id})'>编辑</button>
        <button class="btn btn-red btn-sm" onclick='delWorker(${w.id})'>删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="10" class="empty-row">暂无师傅</td></tr>';
}

function formHtml(w) {
  w = w || {};
  const avatars = ['👨‍🔧','🧑‍🔧','👷','🧔','👷‍♂️','👩‍🔧'];
  return `
    <div class="f-item"><label>姓名 *</label><input id="f_name" value="${esc(w.name || '')}"></div>
    <div class="f-item"><label>电话</label><input id="f_phone" value="${esc(w.phone || '')}"></div>
    <div class="f-item"><label>头像</label>
      <select id="f_avatar">${avatars.map(a => `<option ${w.avatar === a ? 'selected' : ''}>${a}</option>`).join('')}</select>
    </div>
    <div class="f-item"><label>擅长技能</label><input id="f_skill" value="${esc(w.skill || '')}" placeholder="如：空调 / 冰箱 / 洗衣机"></div>
    <div style="display:flex;gap:12px">
      <div class="f-item" style="flex:1"><label>从业年限</label><input id="f_years" type="number" value="${w.years ?? 5}"></div>
      <div class="f-item" style="flex:1"><label>评分(1-5)</label><input id="f_rating" type="number" step="0.1" min="1" max="5" value="${w.rating ?? 5}"></div>
      <div class="f-item" style="flex:1"><label>状态</label>
        <select id="f_status">
          <option value="1" ${w.status !== 0 ? 'selected' : ''}>在岗</option>
          <option value="0" ${w.status === 0 ? 'selected' : ''}>停用</option>
        </select>
      </div>
    </div>`;
}

/** 新增 */
document.getElementById('addBtn').onclick = () => {
  const m = openModal(`
    <div class="m-hd">新增维修师傅<button class="x" onclick="closeModal()">×</button></div>
    <div class="m-bd">${formHtml()}</div>
    <div class="m-ft">
      <button class="btn btn-gray" onclick="closeModal()">取消</button>
      <button class="btn btn-blue" id="saveBtn">保存</button>
    </div>`);
  m.querySelector('#saveBtn').onclick = async () => {
    const body = collectForm(m);
    if (!body.name) return toast('请填写姓名');
    const r = await api('/api/admin/workers', { method: 'POST', body });
    toast(r.msg);
    if (r.code === 0) { closeModal(); load(); }
  };
};

/** 编辑 */
window.editWorker = function (id) {
  const w = workers.find(x => x.id === id);
  const m = openModal(`
    <div class="m-hd">编辑师傅信息<button class="x" onclick="closeModal()">×</button></div>
    <div class="m-bd">${formHtml(w)}</div>
    <div class="m-ft">
      <button class="btn btn-gray" onclick="closeModal()">取消</button>
      <button class="btn btn-blue" id="saveBtn">保存</button>
    </div>`);
  m.querySelector('#saveBtn').onclick = async () => {
    const body = collectForm(m);
    const r = await api('/api/admin/workers/' + id, { method: 'PUT', body });
    toast(r.msg);
    if (r.code === 0) { closeModal(); load(); }
  };
};

function collectForm(m) {
  return {
    name: m.querySelector('#f_name').value.trim(),
    phone: m.querySelector('#f_phone').value.trim(),
    avatar: m.querySelector('#f_avatar').value,
    skill: m.querySelector('#f_skill').value.trim(),
    years: Number(m.querySelector('#f_years').value),
    rating: Number(m.querySelector('#f_rating').value),
    status: Number(m.querySelector('#f_status').value)
  };
}

window.delWorker = async function (id) {
  if (!confirm('确定删除该师傅吗？')) return;
  const r = await api('/api/admin/workers/' + id, { method: 'DELETE' });
  toast(r.msg);
  if (r.code === 0) load();
};

document.getElementById('searchBtn').onclick = load;
document.getElementById('kw').onkeydown = e => { if (e.key === 'Enter') load(); };

(async function init() { await renderLayout('维修师傅管理', 'workers.html'); load(); })();
</script>
</body>
</html>
