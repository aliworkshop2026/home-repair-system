<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 阿李工坊后台</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .auth-tabs { display:flex; margin-bottom:16px; border-bottom:1px solid #eef0f3; }
    .auth-tabs span {
      flex:1; text-align:center; padding:10px 0; font-size:15px; color:#8a8f99;
      cursor:pointer; position:relative; transition:color .15s;
    }
    .auth-tabs span.on { color:#2f86ff; font-weight:700; }
    .auth-tabs span.on::after {
      content:''; position:absolute; left:50%; bottom:-1px; transform:translateX(-50%);
      width:36px; height:3px; border-radius:2px; background:#2f86ff;
    }
    .captcha-row { display:flex; gap:8px; align-items:center; }
    .captcha-row .ipt { flex:1; margin-bottom:0; }
    .captcha-img {
      width:100px; height:42px; border-radius:8px; cursor:pointer; flex-shrink:0;
      border:1px solid #e5e7eb; background:#f4f6f9; object-fit:cover;
    }
    .other-login { margin-top:22px; text-align:center; }
    .ot-title { display:flex; align-items:center; gap:12px; color:#8a8f99; font-size:12.5px; margin-bottom:14px; }
    .ot-title::before, .ot-title::after { content:''; flex:1; height:1px; background:#e8eaee; }
    .other-ways { display:flex; justify-content:center; gap:30px; }
    .other-way { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; transition:transform .15s; }
    .other-way:hover { transform:translateY(-3px); }
    .ow-ico {
      width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:21px; box-shadow:0 2px 10px rgba(0,0,0,.08);
    }
    .other-way span:last-child { font-size:12px; color:#666; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div style="width:380px">
    <div class="login-box">
      <div class="logo">🐴</div>
      <h1>阿李工坊</h1>
      <p>后台管理系统</p>

      <!-- 登录方式切换（默认密码登录） -->
      <div class="auth-tabs">
        <span id="tabPwd" class="on">密码登录</span>
        <span id="tabCaptcha">验证码登录</span>
      </div>

      <!-- 密码登录 -->
      <div id="panePwd">
        <div class="ipt"><i>👤</i><input type="text" id="username" placeholder="管理员账号" value=""></div>
        <div class="ipt"><i>🔒</i><input type="password" id="password" placeholder="管理员密码" value=""></div>
        <button id="loginBtn">登 录</button>
      </div>

      <!-- 验证码登录 -->
      <div id="paneCaptcha" style="display:none">
        <div class="ipt"><i>👤</i><input type="text" id="cUsername" placeholder="管理员账号" value=""></div>
        <div class="captcha-row" style="margin-bottom:14px">
          <div class="ipt"><i>🔑</i><input type="text" id="captchaIpt" placeholder="图形验证码" maxlength="4" value=""></div>
          <img class="captcha-img" id="captchaImg" title="点击刷新验证码" alt="验证码">
        </div>
        <button id="captchaLoginBtn">登 录</button>
      </div>

      <!-- 其他登录方式 -->
      <div class="other-login">
        <div class="ot-title">其他方式登录</div>
        <div class="other-ways">
          <div class="other-way" onclick="thirdLogin('微信')">
            <span class="ow-ico" style="background:#e9f9ef">💚</span>
            <span>微信</span>
          </div>
          <div class="other-way" onclick="thirdLogin('QQ')">
            <span class="ow-ico" style="background:#e8f3ff">🐧</span>
            <span>QQ</span>
          </div>
          <div class="other-way" onclick="switchTab('captcha')">
            <span class="ow-ico" style="background:#fff4e5">🔑</span>
            <span>验证码</span>
          </div>
        </div>
      </div>

      <div class="tip">
        默认管理员账号：<b>admin</b><br>
        默认密码：<b>admin123</b>
      </div>
    </div>
    <a class="back-site" href="../index.html">‹ 返回用户端首页</a>
  </div>
</div>
<script src="js/common.js"></script>
<script>
  let captchaId = '';

  async function refreshCaptcha() {
    const r = await api('/api/auth/captcha');
    if (r.code === 0) {
      captchaId = r.data.id;
      document.getElementById('captchaImg').src =
        'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(r.data.svg)));
    }
  }
  document.getElementById('captchaImg').onclick = refreshCaptcha;

  function switchTab(which) {
    const isPwd = which === 'pwd';
    document.getElementById('tabPwd').classList.toggle('on', isPwd);
    document.getElementById('tabCaptcha').classList.toggle('on', !isPwd);
    document.getElementById('panePwd').style.display = isPwd ? '' : 'none';
    document.getElementById('paneCaptcha').style.display = isPwd ? 'none' : '';
    if (!isPwd) refreshCaptcha();
  }
  document.getElementById('tabPwd').onclick = () => switchTab('pwd');
  document.getElementById('tabCaptcha').onclick = () => switchTab('captcha');

  function thirdLogin(name) {
    toast(name + '登录暂未接入，请使用密码或验证码登录', 2000);
  }

  // 密码登录
  document.getElementById('loginBtn').onclick = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) return toast('请输入账号和密码');
    const r = await api('/api/auth/admin/login', { method: 'POST', body: { username, password } });
    if (r.code === 0) location.href = 'index.html';
    else toast(r.msg);
  };
  document.getElementById('password').onkeydown = e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); };

  // 验证码登录
  document.getElementById('captchaLoginBtn').onclick = async () => {
    const username = document.getElementById('cUsername').value.trim();
    const captcha = document.getElementById('captchaIpt').value.trim();
    if (!username) return toast('请输入管理员账号');
    if (!captcha) return toast('请输入图形验证码');
    const r = await api('/api/auth/admin/login-captcha', { method: 'POST', body: { username, captchaId, captcha } });
    if (r.code === 0) location.href = 'index.html';
    else { toast(r.msg); refreshCaptcha(); document.getElementById('captchaIpt').value = ''; }
  };
  document.getElementById('captchaIpt').onkeydown = e => { if (e.key === 'Enter') document.getElementById('captchaLoginBtn').click(); };
</script>
</body>
</html>
