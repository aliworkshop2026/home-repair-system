<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>在线报修 - 阿李工坊</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="phone no-tab">
  <div class="nav-bar"><a class="back" href="javascript:back()">‹</a><span>在线报修</span></div>

  <!-- 选择的服务 -->
  <div class="card" id="srvCard" style="display:none">
    <div style="display:flex;gap:12px;align-items:center">
      <img id="srvImg" style="width:64px;height:64px;border-radius:10px;object-fit:cover;background:#f4f6f9">
      <div style="flex:1">
        <b id="srvName" style="font-size:16px"></b>
        <div class="price" style="margin-top:6px">
          <span class="yen">¥</span><span class="num" style="font-size:18px" id="srvPrice"></span>
          <span style="font-size:12px" id="srvUnit"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 报修表单 -->
  <div class="form-card">
    <div class="form-row">
      <label>设备名称</label>
      <input type="text" id="deviceName" placeholder="如：海尔壁挂空调 / 创维55寸电视">
    </div>
    <div class="form-row">
      <label>故障描述</label>
      <textarea id="faultDesc" placeholder="请详细描述故障现象，例如：空调不制冷、开机有异响……"></textarea>
    </div>
    <div class="form-row">
      <label>上门地址</label>
      <input type="text" id="address" placeholder="请输入详细地址（小区+门牌号）">
      <span id="pickAddrBtn" style="flex-shrink:0;color:var(--blue);font-size:13px;cursor:pointer;white-space:nowrap">📍 选择地址</span>
    </div>
    <div class="form-row">
      <label>期望时间</label>
      <input type="datetime-local" id="expectTime">
    </div>
    <div class="form-row">
      <label>联系电话</label>
      <input type="tel" id="phone" placeholder="方便工程师联系您（选填）">
    </div>
  </div>

  <div class="submit-wrap">
    <button class="btn-red" style="height:48px;font-size:17px;width:100%" id="submitBtn">提交报修 · 下一步预约师傅</button>
    <div class="pay-tip">提交后可在“我的订单”中随时查看进度</div>
  </div>
</div>

<!-- 已有地址选择弹层（读取地址管理中保存的地址，点选即填入） -->
<div id="addrMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end;justify-content:center">
  <div style="background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:70vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #f0f1f3">
      <b style="font-size:16px">选择服务地址</b>
      <span id="addrMaskClose" style="font-size:20px;color:#999;cursor:pointer">✕</span>
    </div>
    <div id="addrPickList" style="overflow-y:auto;padding:8px 16px 16px"></div>
    <div style="padding:0 16px 20px">
      <button class="btn-plain" style="width:100%;height:42px" onclick="go('address-add.html?redirect=repair.html')">+ 新增地址</button>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/repair.js"></script>
</body>
</html>
